name: CI

on:
  push:
  pull_request:

jobs:
  make:
    name: make (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: make CC=${{ matrix.cc }} CFLAGS="-O2 -Wall -Wextra -Werror -pedantic" all examples
      - name: Smoke test
        run: make CC=${{ matrix.cc }} CFLAGS="-O2 -Wall -Wextra -Werror -pedantic" test
      - name: Golden corpus and hostile-input checks
        run: make CC=${{ matrix.cc }} CFLAGS="-O2 -Wall -Wextra -Werror -pedantic" golden-check hostile thread-probe
      - name: Documentation links and version consistency
        run: make docs-check version-check

  sanitizers:
    name: sanitizers (ASan+UBSan+LSan, TSan, valgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AddressSanitizer, UndefinedBehaviorSanitizer and LeakSanitizer
        run: |
          make CC=gcc CFLAGS="-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all" \
               test golden-check hostile
      - name: ThreadSanitizer
        run: |
          make clean
          make CC=clang CFLAGS="-O1 -g -fsanitize=thread" thread-probe
      - name: Valgrind
        run: |
          make clean
          sudo apt-get update -qq && sudo apt-get install -y -qq valgrind >/dev/null
          make CC=gcc CFLAGS="-O0 -g" build/smoke_test >/dev/null
          valgrind --error-exitcode=1 --leak-check=full --show-leak-kinds=all \
                   --errors-for-leak-kinds=definite,indirect build/smoke_test

  cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build, test
        run: |
          cmake -S . -B out -DCMAKE_BUILD_TYPE=Release
          cmake --build out
          ctest --test-dir out --output-on-failure
